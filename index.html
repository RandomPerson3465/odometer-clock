<html>
    <head>
        <link rel="stylesheet" href="./styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./odometer.css">
    </head>
    <body>
        <div class="container">
            <div class="odometer">1000000</div>
            <div class="bar">
                <div class="bar-filled"></div>
            </div>
        </div>
    </body>
    <script>
        window.odometerOptions = {
            format: 'dd:dd:dd',
            animation: 'minimal'
        }
    </script>
    <script src="./odometer.js"></script>
    <script>
        let rgb = [255, 127, 127];

        setInterval(() => {
            const i = Math.floor(Math.random() * 3);
            if (rgb[i] === 255) rgb[i] = -254;
            else rgb[i] += 1;
            document.body.style.backgroundColor = `rgb(${Math.abs(rgb[0])},${Math.abs(rgb[1])},${Math.abs(rgb[2])})` 
            if ((0.2126*Math.abs(rgb[0])+0.7152*Math.abs(rgb[1])+0.0722*Math.abs(rgb[2]))/255 > 0.5) {
                document.body.style.color = '#000000'
                document.querySelector('.bar-filled').style.backgroundColor = '#000000'
            } else {
                document.body.style.color = '#ffffff'
                document.querySelector('.bar-filled').style.backgroundColor = '#ffffff'
            }
            document.querySelector('.odometer').innerText = 1e6 + (new Date().getHours()) * 10000 + (new Date().getMinutes()) * 100 + (new Date().getSeconds())
            document.querySelector('.bar-filled').style.width = ((new Date().getMilliseconds()) / 10) +'%'
        }, 10)
    </script>
</html>
